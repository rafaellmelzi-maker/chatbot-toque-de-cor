version: '3.9'

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: toque_de_cor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toquedecoradmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ToqueDeCor@2024!}
      POSTGRES_DB: ${POSTGRES_DB:-toque_de_cor}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-toquedecoradmin}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toque_de_cor_network

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: toque_de_cor_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ToqueDeCor@Redis2024!} --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-ToqueDeCor@Redis2024!}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toque_de_cor_network

  # ─── Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    container_name: toque_de_cor_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-toquedecoradmin}:${POSTGRES_PASSWORD:-ToqueDeCor@2024!}@postgres:5432/${POSTGRES_DB:-toque_de_cor}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-ToqueDeCor@Redis2024!}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '3001:3001'
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toque_de_cor_network

  # ─── Frontend Dashboard ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    container_name: toque_de_cor_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - toque_de_cor_network

  # ─── Evolution API (WhatsApp) ─────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: toque_de_cor_evolution
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: 'true'
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-toquedecoradmin}:${POSTGRES_PASSWORD:-ToqueDeCor@2024!}@postgres:5432/${POSTGRES_DB:-toque_de_cor}?schema=evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-ToqueDeCor@Redis2024!}@redis:6379
      WEBHOOK_GLOBAL_URL: http://backend:3001/api/webhooks/whatsapp
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
    ports:
      - '8080:8080'
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toque_de_cor_network

  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: toque_de_cor_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - toque_de_cor_network

volumes:
  postgres_data:
  redis_data:
  evolution_data:

networks:
  toque_de_cor_network:
    driver: bridge
