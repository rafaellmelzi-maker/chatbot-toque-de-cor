# nginx-vps.conf — HTTP only (sem SSL), para VPS com IP direto
# Para adicionar SSL depois: use Certbot + nginx ou Cloudflare proxy

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # ── Rate limiting ──────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=120r/m;

  # ── Gzip ──────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # ── Log format ─────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Servidor principal ─────────────────────────────────────
  server {
    listen 80;
    server_name _;  # aceita qualquer IP/domínio

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── API backend ──────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }

    # ── Webhook (maior rate limit) ───────────────────────────
    location /api/webhooks/ {
      limit_req zone=webhook burst=50 nodelay;
      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Socket.IO (WebSocket) ────────────────────────────────
    location /socket.io/ {
      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400s;
    }

    # ── Uploads estáticos ────────────────────────────────────
    location /uploads/ {
      alias /var/www/uploads/;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    # ── Widget de chat ───────────────────────────────────────
    location /widget/ {
      root /var/www;
      try_files $uri $uri/ =404;
      add_header Access-Control-Allow-Origin "*";
    }

    # ── Health check ─────────────────────────────────────────
    location /health {
      proxy_pass http://backend:3001/api/health;
    }

    # ── Evolution API (acesso interno) ───────────────────────
    # Descomente se quiser expor o painel da Evolution externamente
    # location /evolution/ {
    #   proxy_pass http://evolution:8080/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    # }
  }
}
